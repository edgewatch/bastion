# GitHub Actions workflow that rebuilds and redeploys the Docusaurus site
# (download.edgewatch.com) whenever a release is published on edgewatch/bastion.
#
# This file is AUTHORED in the GitLab repo at ci/github/deploy-pages.yml and is
# mirrored to .github/workflows/deploy-pages.yml on the public GitHub repo by
# the `mirror:website-github` job in .gitlab-ci.yml. Edit it in GitLab, not here.
#
# Publishes via peaceiris → gh-pages (legacy Pages source). The pool is capped
# with DEBIAN_REPO_KEEP_VERSIONS so the tip stays under GitHub Pages' ~1 GiB
# soft limit — exceeding it made the legacy builder return "Page build failed"
# while git still held Packages/meta pointing at missing pool URLs.
name: Deploy GitHub Pages

on:
  release:
    types: [published, edited, deleted, released]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Serialize deploys. Do NOT cancel in-progress runs: a tag can fire several
# release events plus a mirror push to main; cancelling mid-deploy left the
# site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages uses legacy gh-pages branch publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BT="$(gh api "repos/${REPO}/pages" --jq .build_type)"
          if [ "${BT}" != "legacy" ]; then
            echo "Pages: switching build_type ${BT} → legacy (source=gh-pages)"
            gh api -X PUT "repos/${REPO}/pages" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/
          else
            echo "Pages: already build_type=legacy"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Install dependencies
        run: npm ci

      - name: Build site (prebuild regenerates apt repo from releases)
        env:
          DOCS_URL: https://download.edgewatch.com
          BASE_URL: /
          DOWNLOAD_GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ~40MB × 5 bastion-base ≈ 200MB tip — safely under Pages' ~1 GiB soft limit.
          DEBIAN_REPO_KEEP_VERSIONS: '5'
        run: npm run build

      - name: Verify apt pool binaries are in the build output
        run: |
          set -euo pipefail
          POOL="build/debian/bastion/pool"
          test -d "${POOL}"
          mapfile -t debs < <(find "${POOL}" -type f -name '*.deb' | sort)
          count="${#debs[@]}"
          echo "Found ${count} .deb file(s) under ${POOL}"
          if [ "${count}" -lt 1 ]; then
            echo "ERROR: build output has no pool .deb files; refusing to deploy" >&2
            exit 1
          fi
          pkgs="build/debian/bastion/dists/trixie/main/binary-amd64/Packages"
          test -f "${pkgs}"
          missing=0
          while IFS= read -r rel; do
            [ -n "${rel}" ] || continue
            if [ ! -f "build/debian/bastion/${rel}" ]; then
              echo "MISSING pool file listed in Packages: ${rel}" >&2
              missing=$((missing + 1))
            fi
          done < <(awk '/^Filename:/{print $2}' "${pkgs}")
          if [ "${missing}" -ne 0 ]; then
            echo "ERROR: ${missing} Packages Filename(s) missing from build/" >&2
            exit 1
          fi
          du -sh "${POOL}" build/debian/bastion || true
          bytes="$(du -sb build | awk '{print $1}')"
          echo "Total build size: ${bytes} bytes"
          if [ "${bytes}" -gt $((900 * 1024 * 1024)) ]; then
            echo "ERROR: build/ is over 900 MiB; GitHub Pages will fail or 404 files" >&2
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          publish_branch: gh-pages
          # Orphan tip keeps history from re-accumulating old pool blobs.
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          full_commit_message: 'Deploy site for ${{ github.event.release.tag_name || github.sha }}'
