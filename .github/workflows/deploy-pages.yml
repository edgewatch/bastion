# GitHub Actions workflow that rebuilds and redeploys the Docusaurus site
# (download.edgewatch.com) whenever a release is published on edgewatch/bastion.
#
# This file is AUTHORED in the GitLab repo at ci/github/deploy-pages.yml and is
# mirrored to .github/workflows/deploy-pages.yml on the public GitHub repo by
# the `mirror:website-github` job in .gitlab-ci.yml. Edit it in GitLab, not here.
#
# The build's prebuild step (website/scripts/generate-debian-repo.mjs) reads the
# GitHub Releases API live, so the static apt archive and the download page
# always reflect every published release.
name: Deploy GitHub Pages

on:
  release:
    types: [published, edited, deleted, released]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Serialize deploys and drop superseded runs (a tag both publishes a release
# and pushes the mirror to main, which can trigger two runs).
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Install dependencies
        run: npm ci

      - name: Build site (prebuild regenerates apt repo from all releases)
        env:
          DOCS_URL: https://download.edgewatch.com
          BASE_URL: /
          DOWNLOAD_GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          full_commit_message: 'Deploy site for ${{ github.event.release.tag_name || github.sha }}'
