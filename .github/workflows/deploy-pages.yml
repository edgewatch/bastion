# GitHub Actions workflow that rebuilds and redeploys the Docusaurus site
# (download.edgewatch.com) whenever a release is published on edgewatch/bastion.
#
# This file is AUTHORED in the GitLab repo at ci/github/deploy-pages.yml and is
# mirrored to .github/workflows/deploy-pages.yml on the public GitHub repo by
# the `mirror:website-github` job in .gitlab-ci.yml. Edit it in GitLab, not here.
#
# Deploy uses actions/deploy-pages (build_type=workflow), NOT the legacy
# gh-pages branch builder. The legacy builder started returning
# "Page build failed" once the published tree exceeded GitHub Pages' ~1 GiB
# soft limit, leaving Packages/meta updated in git while pool URLs 404'd.
name: Deploy GitHub Pages

on:
  release:
    types: [published, edited, deleted, released]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Serialize deploys. Do NOT cancel in-progress runs: a tag can fire several
# release events plus a mirror push to main; cancelling mid-deploy left the
# site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages uses GitHub Actions (workflow)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BT="$(gh api "repos/${REPO}/pages" --jq .build_type)"
          if [ "${BT}" != "workflow" ]; then
            echo "Pages: switching build_type legacy → workflow"
            gh api -X PUT "repos/${REPO}/pages" -f build_type=workflow
          else
            echo "Pages: already build_type=workflow"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Install dependencies
        run: npm ci

      - name: Build site (prebuild regenerates apt repo from releases)
        env:
          DOCS_URL: https://download.edgewatch.com
          BASE_URL: /
          DOWNLOAD_GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep the published pool under GitHub Pages' ~1 GiB soft limit.
          DEBIAN_REPO_KEEP_VERSIONS: '8'
        run: npm run build

      - name: Verify apt pool binaries are in the build output
        run: |
          set -euo pipefail
          POOL="build/debian/bastion/pool"
          test -d "${POOL}"
          mapfile -t debs < <(find "${POOL}" -type f -name '*.deb' | sort)
          count="${#debs[@]}"
          echo "Found ${count} .deb file(s) under ${POOL}"
          if [ "${count}" -lt 1 ]; then
            echo "ERROR: build output has no pool .deb files; refusing to deploy" >&2
            exit 1
          fi
          pkgs="build/debian/bastion/dists/trixie/main/binary-amd64/Packages"
          test -f "${pkgs}"
          missing=0
          while IFS= read -r rel; do
            [ -n "${rel}" ] || continue
            if [ ! -f "build/debian/bastion/${rel}" ]; then
              echo "MISSING pool file listed in Packages: ${rel}" >&2
              missing=$((missing + 1))
            fi
          done < <(awk '/^Filename:/{print $2}' "${pkgs}")
          if [ "${missing}" -ne 0 ]; then
            echo "ERROR: ${missing} Packages Filename(s) missing from build/" >&2
            exit 1
          fi
          du -sh "${POOL}" build/debian/bastion || true
          bytes="$(du -sb build | awk '{print $1}')"
          echo "Total build size: ${bytes} bytes"
          if [ "${bytes}" -gt $((950 * 1024 * 1024)) ]; then
            echo "ERROR: build/ is over 950 MiB; refusing to deploy oversized artifact" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
